name: Build Android APK

on:
  push:
    branches:
      - arena/01a10696-gemini-created-app
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Used only on failure: a check run carrying the first compiler errors, so a
  # failed build is diagnosable from the API/PR without downloading the job log.
  checks: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || printf '%s' "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Build installable debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee app/build/ci-build.log

      - name: Publish build failure diagnostics
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_LOG: app/build/ci-build.log
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          log = Path(os.environ["BUILD_LOG"])
          lines = log.read_text(errors="replace").splitlines() if log.exists() else []
          interesting = [
              i for i, line in enumerate(lines)
              if line.startswith("e: ") or "error:" in line.lower() or line.startswith("FAILURE:")
          ]
          if interesting:
              start = max(0, min(interesting) - 3)
              excerpt = chr(10).join(lines[start:start + 120])
          else:
              excerpt = chr(10).join(lines[-120:])

          # A check run keeps the text on GitHub's API (readable without the job log).
          payload = {
              "name": "Debug build diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {
                  "title": "Debug build failed",
                  "summary": "First errors from :app:assembleDebug",
                  "text": excerpt[-60000:],
              },
          }
          Path("/tmp/build-check.json").write_text(json.dumps(payload))
          subprocess.run(
              ["gh", "api", "-X", "POST",
               f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
               "--input", "/tmp/build-check.json"],
              check=False,
          )

          # Short annotations too; the runner drops very long ones.
          for line in [l for l in excerpt.splitlines() if l.startswith("e: ")][:3]:
              print(f"::error title=Compile error::{line[:1200]}")
          PY

      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee app/build/ci-test.log

      - name: Annotate unit test failure details
        if: failure() && steps.unit_tests.outcome == 'failure'
        env:
          TEST_LOG: app/build/ci-test.log
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          failures = []
          for report in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      result = case.find(tag)
                      if result is not None:
                          name = f"{case.get('classname', '')}.{case.get('name', '')}"
                          message = result.get("message", "")
                          trace = (result.text or "").strip()
                          failures.append(f"{name}: {message}{chr(10)}{trace[:5000]}")

          if failures:
              details = chr(10).join(failures)[:9000]
          else:
              lines = Path(os.environ["TEST_LOG"]).read_text(errors="replace").splitlines()
              start = next((i for i, line in enumerate(lines) if line.startswith("FAILURE:")), max(0, len(lines) - 80))
              details = chr(10).join(lines[start:start + 50])[:9000]
          escaped = details.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
          print(f"::error title=Unit test failure::{escaped}")
          PY

      - name: Upload unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-diagnostics
          path: |
            app/build/ci-build.log
            app/build/ci-test.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
