name: Build Gecko Browser

on:
  push:
    branches:
      - arena/8b7bbf86-gemini-created-app
  pull_request:
    branches:
      - arena/8b7bbf86-gemini-created-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build 32-bit ARMv7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || printf '%s' "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          for package in "platform-tools" "platforms;android-37" "build-tools;36.0.0"; do
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "$package" || true
          done

      - name: Build and test
        run: |
          mkdir -p app/build
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee app/build/ci-build.log

      - name: Report build failure
        if: failure()
        run: |
          if [ -f app/build/ci-build.log ]; then
            {
              echo "## Gradle build failure details"
              echo '```text'
              tail -n 180 app/build/ci-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              case "$line" in
                e:*|*"What went wrong"*|*"Execution failed"*) echo "::error title=Gradle failure::$line" ;;
              esac
            done < app/build/ci-build.log
          fi

      - name: Upload the ARMv7 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-browser-armeabi-v7a-32-bit
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish phone APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="browser-armv7-phone-latest"
          title="Gecko Browser - ARMv7 Phone (32-bit)"
          apk="app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk"
          asset="app/build/gecko-browser-armv7-phone.apk"
          notes="32-bit ARMv7 (armeabi-v7a) debug APK for ARMv7 phones. No 64-bit libraries are included."
          cp "$apk" "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" --title "$title" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "$asset" --clobber

      - name: Publish emulator APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="browser-armv7-emulator-latest"
          title="Gecko Browser - ARMv7 Emulator (32-bit)"
          apk="app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk"
          asset="app/build/gecko-browser-armv7-emulator.apk"
          notes="The same 32-bit ARMv7 (armeabi-v7a) APK as the phone release, for ARM-compatible Android emulator images. No 64-bit libraries are included."
          cp "$apk" "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" --title "$title" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "$asset" --clobber
